<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Captain Cafe - المنيو</title>
    <style>
        /* استخدام الألوان المطلوبة */
        :root {
            --dark-blue: #132A49;
            --light-blue: #D6E5F3;
            --creamy-beige: #F0E8D1;
            --gray: #7F7B82;
            --white: #FFFFFF;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--creamy-beige); 
            color: var(--dark-blue);
            margin: 0; 
            padding: 20px; 
            text-align: center;
        }

        .logo { width: 150px; margin-bottom: 10px; }
        
        .tagline { 
            font-size: 1.2em; 
            color: var(--dark-blue); 
            margin-bottom: 30px; 
            font-style: italic;
        }

        .menu-section { 
            background: var(--white); 
            padding: 20px; 
            border-radius: 15px; 
            margin: 15px auto; 
            max-width: 600px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 { border-bottom: 2px solid var(--light-blue); padding-bottom: 10px; }
        
        .item { 
            display: flex; 
            justify-content: space-between; 
            padding: 8px 0; 
            border-bottom: 1px solid #eee; 
            color: var(--gray);
        }
    </style>
</head>
<body>

    <!-- إضافة اللوجو -->
    <img src="URL_OF_YOUR_LOGO_HERE" alt="Captain Cafe Logo" class="logo">
    
    <!-- العبارة المطلوبة -->
    <h1 class="tagline">رحلة مذاق لا تنسى</h1>

    <!-- مثال لقسم واحد، يمكنك تكرار الكود لكل الأقسام العشرة -->
    <div class="menu-section">
        <h2>القهوة المختصة</h2>
        <div class="item"><span>V60</span> <span>3.00$</span></div>
        <div class="item"><span>Chemex</span> <span>3.50$</span></div>
        <!-- أضف بقية الـ 10 أصناف هنا بنفس الطريقة -->
    </div>

</body>
</html>
